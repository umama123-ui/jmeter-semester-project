name: JMeter Performance Tests

on:
  push:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download Apache JMeter
        run: |
          wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz && mv apache-jmeter-5.6.3 jmeter

      - name: Clean and Prepare Directories
        run: |
          rm -rf results reports
          mkdir -p results reports

      - name: Run Performance Tests
        run: |
          chmod +x jmeter/bin/jmeter.sh
          ./jmeter/bin/jmeter.sh -n \
            -t tests/load_test.jmx \
            -l results/results.jtl \
            -e -o reports/

      - name: Verify Reports Generated
        run: |
          echo "Checking if reports folder exists and has content..."
          ls -la reports/ || echo "ERROR: reports folder not found"
          find reports -type f | head -20 || echo "ERROR: No files in reports folder"

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: reports/
